name: Deploy Portofolio Web

# Menentukan kapan pipeline ini akan berjalan
on:
  push:
    branches:
      - main

jobs:
  # ==========================================
  # JOB 1: Pabrik Pembuat Image
  # ==========================================
  build-and-push:
    name: Build & Push to Docker Hub
    runs-on: ubuntu-latest

    steps:
      - name: 1. Mengambil Source Code dari GitHub
        uses: actions/checkout@v4

      - name: 2. Autentikasi ke Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 3. Build & Push Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Ganti "portfolio-app" dengan nama aplikasi yang Anda inginkan
          tags: ${{ secrets.DOCKER_USERNAME }}/portofolio-web:latest

  # ==========================================
  # JOB 2: Kurir Pengantar ke Server
  # ==========================================
  deploy-to-vm:
    name: Eksekusi Update di VM
    needs: build-and-push # Wajib menunggu JOB 1 sukses tanpa error
    runs-on: ubuntu-latest

    steps:
      - name: 1. Remote SSH ke Server dan Eksekusi Perintah
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "Memulai proses update aplikasi..."

            cd ~/portofolio-infra

            sudo docker compose pull portofolio-web

            sudo docker compose up -d portofolio-web

            sudo docker image prune -f

            echo "Update berhasil dieksekusi!"
